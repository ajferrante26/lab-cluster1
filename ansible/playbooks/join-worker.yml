---
- name: Configure and join a Kubernetes worker node
  hosts: workers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Generate fresh join command from control plane
      delegate_to: k8s-ctrl
      become: true
      command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false
      tags: always

  tasks:
    - name: Install common preflight dependencies
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: true
      loop:
        - conntrack
        - ebtables
        - ipset
        - socat

    - name: Check if kubelet is already configured
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join the Kubernetes cluster
      ansible.builtin.command: "{{ join_cmd.stdout }}"
      when: not kubelet_conf.stat.exists
